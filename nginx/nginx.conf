events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;

    # Docker assigns a new IP when a backend container is recreated.  Resolve
    # service names continuously so existing users can reconnect after a node restart.
    resolver 127.0.0.11 valid=1s ipv6=off;
    upstream whiteboard_backend {
        zone whiteboard_backend 64k;
        server backend-1:8000 resolve;
        server backend-2:8000 resolve;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /ws/ {
            proxy_pass http://whiteboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location /health { proxy_pass http://whiteboard_backend/health; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
