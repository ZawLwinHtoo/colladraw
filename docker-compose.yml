version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: collabdraw_redis
    ports:
      - "6379:6379"

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: collabdraw_node1
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ID=node-1
    ports:
      - "8000:8000"
    depends_on:
      - redis

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: collabdraw_node2
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ID=node-2
    ports:
      - "8001:8001"
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: collabdraw_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
